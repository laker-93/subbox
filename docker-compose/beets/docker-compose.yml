---
version: "3"
services:
  beetslajp:
    image: lscr.io/linuxserver/beets:latest
    container_name: ${NAME}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /Users/lukepurnell/workspace/subbox/private/${SUBBOXUSERNAME}/beets/config:/config
      - type: volume
        source: private-sorted
        target: /music
        volume:
          nocopy: true
          subpath: ${SUBBOXUSERNAME}
      - type: volume
        source: private-staged
        target: /downloads
        volume:
          nocopy: true
          subpath: ${SUBBOXUSERNAME}
    ports:
      - ${SUBBOXPORT}:8337
    restart: unless-stopped
#    networks:
#      - traefik_default
#networks:
#  traefik_default:
#    external: true
#    name: traefik_default

volumes:
  private-staged:
    external: true
    name: private-staged
  private-sorted:
    external: true
    name: private-sorted
