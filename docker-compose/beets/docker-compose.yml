---
version: "3"
services:
  beetslajp:
    image: lscr.io/linuxserver/beets:latest
    container_name: ${NAME}
    user: root
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - /Users/lukepurnell/workspace/subbox/private/${SUBBOXUSERNAME}/beets/config:/config
      - /Users/lukepurnell/workspace/subbox/lajp/beets_import:/downloads
      - type: volume
        source: private-music
        target: /music
        volume:
          nocopy: true
          subpath: ${SUBBOXUSERNAME}
      #- type: volume
      #  source: private-staged
      #  target: /downloads
      #  volume:
      #    nocopy: true
      #    subpath: ${SUBBOXUSERNAME}
    ports:
      - ${SUBBOXPORT}:8337
    restart: unless-stopped
    networks:
      - traefik_default
networks:
  traefik_default:
    external: true
    name: traefik_default

volumes:
  private-staged:
    external: true
    name: private-staged
  private-music:
    external: true
    name: private-music
