version: '3.4'
services:
  navidrome:
    image: deluan/navidrome:0.60.3
    restart: unless-stopped
    container_name: "${NAME}"
    user: "1000:1000"
    ports:
      - "${SUBBOXPORT}:4533"
    environment:
      #ND_SCANSCHEDULE: 1
      ND_LOGLEVEL: debug
      ND_SESSIONTIMEOUT: 24h
      ND_SUBSONIC_DEFAULTREPORTREALPATH: true
      # must add this so navidrome can respond to the path navidrome is to be accessed on via traefik
      #ND_BASEURL: /navidrome
      ND_MUSICFOLDER: "/music/${SUBBOXUSERNAME}"
      ND_DATAFOLDER: "/users/${SUBBOXUSERNAME}/navidrome/data"
      ND_CONFIGFILE: "/users/${SUBBOXUSERNAME}/navidrome/data/navidrome.toml"
      ND_PROMETHEUS_ENABLED: "true"
      ND_PROMETHEUS_METRICSPATH: "/metrics"
    volumes:
      - "/home/deploy/subbox/users:/users"
      - "private-music:/music:ro"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${NAME}.rule=Host(`${NAME}.sub-box.net`)"
      - "traefik.http.services.${NAME}.loadbalancer.server.port=4533"
      - "traefik.http.routers.${NAME}.entrypoints=websecure"
      - "traefik.http.routers.${NAME}.tls.certresolver=le"
      - "traefik.http.routers.${NAME}.middlewares=cors"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"

volumes:
  #public-music:
  #  external: true
  private-music:
    external: true
    name: private-music


networks:
  traefik:
    external: true
    name: traefik
