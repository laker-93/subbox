version: '3.4'
services:
  navidrome:
    image: neodrome:latest
    restart: unless-stopped
    container_name: "${NAME}"
    user: "501:20"
    ports:
      - "${SUBBOXPORT}:4533"
    environment:
      #ND_SCANSCHEDULE: 1
      ND_LOGLEVEL: debug
      ND_SESSIONTIMEOUT: 24h
      # must add this so navidrome can respond to the path navidrome is to be accessed on via traefik
      #ND_BASEURL: /navidrome
    volumes:
      - "/Users/lukepurnell/workspace/subbox/private/${SUBBOXUSERNAME}/navidrome/data:/data"
      - type: volume
        source: private-music
        target: /music/private
        read_only: true
        volume:
          nocopy: true
          subpath: ${SUBBOXUSERNAME}
      - "public-music:/music/public:ro"
    networks:
      - traefik_default

volumes:
  public-music:
    external: true
  private-music:
    external: true
    name: private-music


networks:
  traefik_default:
    external: true
    name: traefik_default
